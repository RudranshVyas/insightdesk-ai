name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs first and independently: a leaked dataset or secret is a fact about the
  # commit, not about whether the tests happen to pass.
  guard:
    name: Artifact and secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a dataset, artifact, or secret is committed
        run: |
          set -euo pipefail
          # Committed fixtures are the only data that may live in git.
          BAD=$(git ls-files \
            'data/raw/*' \
            'data/processed/*' \
            'artifacts/*' \
            '.env' '.env.*' \
            '*.faiss' '*.joblib' '*.sqlite' '*.parquet' '*.npz' '*.pkl' \
            | grep -v '\.gitkeep$' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::These files must never be committed:"
            echo "$BAD"
            exit 1
          fi
          echo "Clean: no dataset, artifact, index, or secret in git."

      - name: Fail if a large file slipped in
        run: |
          set -euo pipefail
          BIG=$(git ls-files | xargs -r -I{} find {} -type f -size +2M 2>/dev/null || true)
          if [ -n "$BIG" ]; then
            echo "::error::Files over 2 MB are committed; datasets and indexes do not belong in git:"
            echo "$BIG"
            exit 1
          fi

  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check backend

      # Every gate below runs against the committed synthetic fixtures.
      # CI never sees the real dataset.
      - name: AI quality gates
        run: |
          python -m pytest backend/tests -q \
            --junitxml=pytest.xml

      - name: Gate — retrieval index purity (no resolution text indexed)
        run: python -m pytest backend/tests -q -k "document_is_problem_side or banned_from_document or retrieval_document"

      - name: Gate — citation validation (fabricated id is dropped)
        run: python -m pytest backend/tests/test_support_brief.py -q -k "fabricated"

      - name: Gate — weak retrieval makes zero provider calls
        run: python -m pytest backend/tests/test_support_brief.py -q -k "weak_retrieval_makes_zero"

      - name: Gate — the model cannot emit a confidence value
        run: python -m pytest backend/tests/test_support_brief.py -q -k "no_confidence_field"

      - name: Gate — redaction and injection handling on the red-team fixture
        run: python -m pytest backend/tests/test_redteam_fixture.py -q

      - name: Gate — capability gating disables, never fakes a zero
        run: python -m pytest backend/tests/test_capabilities_v2.py -q

      - name: Gate — app boots and serves with LLM_PROVIDER=none
        env:
          LLM_PROVIDER: none
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.app.main import app
          with TestClient(app) as c:
              r = c.get('/api/v1/health')
              assert r.status_code == 200, r.text
              caps = c.get('/api/v1/capabilities')
              assert caps.status_code == 200, caps.text
          print('boots and serves with no provider configured')
          "
