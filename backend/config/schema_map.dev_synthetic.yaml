# Mapping for the SYNTHETIC development dataset produced by
# `python -m backend.scripts.make_dev_dataset`.
#
# For the real Kaggle CSV, run:
#   python -m backend.scripts.ingest_tickets --csv data/raw/<file>.csv --suggest-mapping
# review the generated file, then pass it with --mapping.

dataset:
  name: dev-synthetic-tickets
  source_url: generated locally by backend/scripts/make_dev_dataset.py
  download_date: "2026-07-27"
  license_status: owned
  synthetic: true

columns:
  ticket_id: Ticket ID
  created_at: Ticket Created At
  resolved_at: Time to Resolution
  customer_segment: Customer Segment
  product_area: Product Purchased
  issue_type: Ticket Type
  priority: Ticket Priority
  status: Ticket Status
  channel: Ticket Channel
  platform: Platform
  region: Region
  sla_plan: SLA Plan
  issue_subject: Ticket Subject
  issue_description: Ticket Description
  resolution_notes: Resolution
  first_response_at: First Response Time
  csat_score: Customer Satisfaction Rating
  escalated: Escalated

privacy:
  customer_id_column: Customer Email

normalization:
  nulls: ["", "na", "n/a", "null", "none", "nan", "-", "--"]
  timestamps:
    format: null
    forbidden_created_at_columns: ["Date of Purchase"]
  status:
    resolved: ["Closed", "Resolved"]
    open: ["Open"]
    pending: ["Pending Customer Response"]
  booleans:
    true_values: ["yes", "true", "1", "y"]
    false_values: ["no", "false", "0", "n"]
  csat:
    scale_min: 1
    scale_max: 5
    zero_means_no_response: true
  resolved_definition:
    statuses: ["resolved"]

derivations:
  resolution_time_hours: from_timestamps
  response_time_hours: from_timestamps
